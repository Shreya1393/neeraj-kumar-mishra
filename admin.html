<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Feedback Moderation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#b89e6c;--bg:#14151a;--card:#1f2127;--tx:#e8e8ec;--mu:#a3a4ac}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Source Sans 3',system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 22px;background:#0f1013;border-bottom:1px solid #b89e6c40}header b{font:700 24px 'Cormorant Garamond',serif;color:var(--gold);margin-right:auto}header span{color:var(--mu);font-size:14px}
main{max-width:860px;margin:0 auto;padding:26px 18px 60px}
button{font:600 14px 'Source Sans 3',sans-serif;border-radius:30px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--gold);background:none;color:var(--gold)}button.pri{background:var(--gold);color:#14151a}button.del{border-color:#e07a7a;color:#e07a7a}button:hover{filter:brightness(1.15)}button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.box{background:var(--card);border:1px solid #b89e6c40;border-radius:12px;padding:28px;text-align:center}.box h1{font:700 30px 'Cormorant Garamond',serif;margin:0 0 8px}.er{color:#ff9a9a;margin-top:12px}
.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button.on{background:var(--gold);color:#14151a}
.it{background:var(--card);border:1px solid #ffffff1c;border-radius:10px;padding:16px 18px;margin-bottom:12px}.it .s{color:var(--gold);letter-spacing:3px}.it p{margin:6px 0 10px;white-space:pre-wrap;word-break:break-word}.it small{color:var(--mu)}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.em{color:var(--mu);text-align:center;padding:30px}
</style></head><body>
<header><b>Feedback Moderation</b><span id="who"></span><button id="out" hidden>Sign out</button></header>
<main>
<div class="box" id="login"><h1>Admin Sign In</h1><p>Sign in with the admin Google account to manage feedback.</p><button class="pri" id="in">Sign in with Google</button><div class="er" id="le"></div></div>
<div id="panel" hidden><div class="tabs"><button data-t="pending" class="on" id="tp">Pending (0)</button><button data-t="live" id="tl">Published (0)</button></div><div id="items"></div></div>
</main>
<script type="module">
const firebaseConfig={apiKey:"AIzaSyDJXAMgJlmhT75WfjRpRlL_zpYxuC9IcRw",authDomain:"advocate-neeraj.firebaseapp.com",projectId:"advocate-neeraj",storageBucket:"advocate-neeraj.firebasestorage.app",messagingSenderId:"209464203175",appId:"1:209464203175:web:ac367069b3d023ec25c882"}; // <-- index.html wala hi Firebase config yahan bhi paste karo
const $=id=>document.getElementById(id);
if(!firebaseConfig.projectId){$('le').textContent='Firebase config is not added yet. Paste it in this file first.'}else{
const[{initializeApp},A,F]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);
const app=initializeApp(firebaseConfig),auth=A.getAuth(app),db=F.getFirestore(app);
let all=[],tab='pending';
$('in').onclick=async()=>{$('le').textContent='';try{await A.signInWithPopup(auth,new A.GoogleAuthProvider())}catch(e){$('le').textContent='Sign in failed: '+(e.code||e.message)}};
$('out').onclick=()=>A.signOut(auth);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;show()});
A.onAuthStateChanged(auth,async u=>{
 $('login').hidden=!!u;$('panel').hidden=!u;$('out').hidden=!u;$('who').textContent=u?u.email:'';
 if(!u)return;
 try{const snap=await F.getDocs(F.query(F.collection(db,'reviews'),F.orderBy('createdAt','desc')));all=snap.docs.map(d=>({id:d.id,...d.data()}));show()}
 catch(e){$('panel').hidden=true;$('login').hidden=false;$('le').textContent='This account is not authorised as admin.';A.signOut(auth)}});
function show(){
 const pend=all.filter(r=>!r.approved),live=all.filter(r=>r.approved);
 $('tp').textContent='Pending ('+pend.length+')';$('tl').textContent='Published ('+live.length+')';
 $('tp').classList.toggle('on',tab==='pending');$('tl').classList.toggle('on',tab==='live');
 const box=$('items'),rows=tab==='pending'?pend:live;box.replaceChildren();
 if(!rows.length){const e=document.createElement('div');e.className='em';e.textContent=tab==='pending'?'No feedback waiting for approval.':'Nothing published yet.';box.append(e);return}
 rows.forEach(r=>{const c=document.createElement('div');c.className='it';
  const s=document.createElement('div');s.className='s';s.textContent='★'.repeat(r.rating||0)+'☆'.repeat(5-(r.rating||0));
  const p=document.createElement('p');p.textContent=r.message||'';
  const m=document.createElement('small');let d='';try{d=r.createdAt.toDate().toLocaleString('en-IN')}catch(e){}m.textContent=(r.name||'')+(d?'  ·  '+d:'');
  const a=document.createElement('div');a.className='acts';
  const t=document.createElement('button');t.className=r.approved?'':'pri';t.textContent=r.approved?'Unpublish':'Approve & Publish';
  t.onclick=async()=>{t.disabled=true;try{await F.updateDoc(F.doc(db,'reviews',r.id),{approved:!r.approved});r.approved=!r.approved;show()}catch(e){alert('Action failed: '+(e.code||e.message));t.disabled=false}};
  const x=document.createElement('button');x.className='del';x.textContent='Delete';
  x.onclick=async()=>{if(!confirm('Delete this feedback permanently?'))return;x.disabled=true;try{await F.deleteDoc(F.doc(db,'reviews',r.id));all=all.filter(z=>z.id!==r.id);show()}catch(e){alert('Delete failed: '+(e.code||e.message));x.disabled=false}};
  a.append(t,x);c.append(s,p,m,a);box.append(c)})}
}
</script></body></html>
